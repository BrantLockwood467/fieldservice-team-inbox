[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldservice-team-inbox"
version = "0.1.0"
description = "Route typed field-service contact submissions to a team inbox."
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/fieldservice_inbox"]

